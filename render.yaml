
services:
  - type: web
    name: advisoriq
    runtime: python
    plan: free
    region: singapore

    buildCommand: pip install -r requirements.txt && python rag.py && python checker.py

    startCommand: python app.py

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10

      - key: GOOGLE_API_KEY
        sync: false

      - key: LANGCHAIN_API_KEY
        sync: false

      - key: LANGCHAIN_TRACING_V2
        value: "true"

      - key: LANGCHAIN_PROJECT
        value: advisor_iq
